[project]
name = "ir-migration"
version = "0.1.0"
description = "structural analysis of Iran's migration network"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "powerlaw>=2.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
ir-migration = "ir_migration:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
